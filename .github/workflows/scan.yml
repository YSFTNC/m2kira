# m2kira — PC kapalıyken de çalışan zamanlanmış tarama (GitHub Actions, ücretsiz).
#  * 30 dakikada bir: Telegram komutlarını işle -> emlakjet (+ varsa sahibinden e-postaları) + PC'den gelen
#    hepsiemlak ve sahibinden beslemelerini işle -> bildir.
#  * PC açıkken Görev Zamanlayıcı `python main.py feed-push` ile hepsiemlak'ı ve sahibinden'i tarar, `feed`
#    dalına yazar ve bu işi `sources=hepsiemlak_feed,sahibinden_feed` ile hemen tetikler (hepsiemlak GitHub
#    IP'lerini Cloudflare'da engelliyor; sahibinden giriş yapılmış gerçek Chrome istiyor).
#  * Her gün 09:00 (TR): günlük özet.  * Her çalıştırmada filtre sayfası GitHub Pages'e yayınlanır.
#  * Veritabanı (data/m2kira.sqlite) çalıştırmalar arasında actions/cache ile taşınır.
# Gerekli secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. İsteğe bağlı: IMAP_HOST, IMAP_USER, IMAP_PASSWORD.
# Not: GitHub zamanlanmış işleri birkaç dakika gecikmeli başlatabilir; public repoda 60 gün commit
# olmazsa zamanlama otomatik durur (Actions sekmesinden tekrar açılır).
name: m2kira

on:
  schedule:
    # Hedef: 30 dakikada bir yenileme. GitHub zamanlanmış çalıştırmaları sık düşürüyor (20.10.2026: 10 saatte
    # 6 zamanlamadan 1'i çalıştı), bu yüzden 15 dakikada bir denenir; tarama sıklığını kod korur (emlakjet en az
    # 25 dk arayla, beslemeler bir kez işlenir). Güvenilir 30 dakika için README'deki dış tetikleyiciye bakın.
    - cron: "8,23,38,53 * * * *"
    - cron: "0 6 * * *"     # 09:00 Türkiye: günlük özet
  workflow_dispatch:
    inputs:
      sources:
        description: "Taranacak kaynaklar (boş = varsayılan). PC beslemeleri: hepsiemlak_feed, sahibinden_feed"
        required: false
        default: ""
      force:
        description: "1 = emlakjet yakın zamanda tarandıysa da yeniden tara (sitedeki Şimdi tara)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: m2kira
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Istanbul
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      # hepsiemlak doğrudan değil PC beslemesinden; sahibinden tarayıcı modu sunucuda çalışmaz
      M2KIRA_SOURCES: ${{ inputs.sources || 'hepsiemlak_feed,sahibinden_feed,emlakjet,sahibinden_mail' }}
      M2KIRA_BLOCK_COOLDOWN_MIN: "0"   # her çalıştırma farklı IP: önceki engel yüzünden kaynağı atlama
      # zamanlama + PC tetiklemesi üst üste gelebilir: siteyi 25 dakikadan sık tarama (sitedeki Şimdi tara hariç)
      M2KIRA_MIN_INTERVAL_MIN: ${{ inputs.force == '1' && '0' || '25' }}
      M2KIRA_SUMMARY_FALLBACK: "1"   # 09:00 zamanlaması düşerse özet sonraki ilk çalıştırmada gider
      M2KIRA_HEARTBEAT: "1"          # gündüz 3 saat sessizse "değişiklik yok, sistem çalışıyor" mesajı
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Veritabanını geri yükle
        uses: actions/cache/restore@v4
        with:
          path: data/m2kira.sqlite
          key: m2kira-db-${{ github.run_id }}
          restore-keys: |
            m2kira-db-

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: hepsiemlak beslemesi (PC'den) + site ayarları
        run: |
          mkdir -p data/feed
          if git fetch -q --depth=1 origin feed 2>/dev/null; then
            for f in hepsiemlak sahibinden; do
              if git show FETCH_HEAD:feed/$f.json > data/feed/$f.json 2>/dev/null; then
                python -c "import json,sys; d=json.load(open('data/feed/$f.json', encoding='utf-8')); print('$f beslemesi:', d['generated'], d['listings'], 'ilan')"
              else rm -f data/feed/$f.json; echo "$f beslemesi yok"; fi
            done
            git show FETCH_HEAD:feed/pc_status.json > data/feed/pc_status.json 2>/dev/null || rm -f data/feed/pc_status.json
            if git show FETCH_HEAD:feed/settings.json > data/feed/settings.json 2>/dev/null; then
              python -c "import json; d=json.load(open('data/feed/settings.json', encoding='utf-8')); print('site ayarları:', d.get('updated'))"
            else rm -f data/feed/settings.json; echo "site ayarı yok"; fi
          fi

      - name: Günlük özet
        if: github.event.schedule == '0 6 * * *'
        run: python main.py summary

      - name: Komutlar + tarama
        if: github.event.schedule != '0 6 * * *'
        run: |
          python main.py bot-once || true
          python main.py scan
          python main.py bot-once || true

      - name: Veritabanını kaydet
        if: always() && hashFiles('data/m2kira.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/m2kira.sqlite
          key: m2kira-db-${{ github.run_id }}

      - name: Filtre sayfasını üret
        if: always() && hashFiles('data/m2kira.sqlite') != ''
        run: python main.py export-web --out _site

      - name: Pages ayarı
        if: always() && hashFiles('_site/index.html') != ''
        uses: actions/configure-pages@v5

      - name: Pages paketi
        if: always() && hashFiles('_site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pages yayını
        id: deploy
        if: always() && hashFiles('_site/index.html') != ''
        uses: actions/deploy-pages@v4
