# Geçici deneme iş akışı (sonra silinecek): GitHub sunucusundan sitelere WARP ile/WARP'sız erişim.
name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.48.0 && google-chrome --version
      - name: direct (WARP yok)
        run: python .github/probe/probe.py direct
      - name: WARP kur ve bağlan (proxy modu)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 1; done
          warp-cli --accept-tos status
          curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc|warp|colo)="
          echo "direct ip: $(curl -s https://www.cloudflare.com/cdn-cgi/trace | grep ^ip=)"
          echo "curl hepsiemlak via warp: $(curl -s -o /dev/null -w '%{http_code}' -x socks5h://127.0.0.1:40000 -A 'Mozilla/5.0' https://www.hepsiemlak.com/robots.txt)"
      - name: WARP headless
        run: python .github/probe/probe.py warp
      - name: WARP headed (xvfb)
        run: xvfb-run -a python .github/probe/probe.py warp-headed
