# m2kira yapılandırması — Ankara M2 hattı eşyalı kiralık takip
# Sırlar (Telegram token vb.) .env dosyasında; bkz. .env.example

budget: 37000              # TL/ay tavan (Telegram'da /butce ile de değiştirilebilir)
budget_tolerance_pct: 5    # bu kadar aşanlar "pazarlıkla" etiketiyle gösterilir
scan_interval_hours: 0.5      # 30 dakikada bir (PC görevi ve GitHub aralıkları buna göre)
daily_summary_time: "09:00"
timezone: "Europe/Istanbul"
scan_on_start: true        # `run` başlar başlamaz bir tarama yap

max_walk_m: 1000           # istasyona kuş uçuşu ≤ 1000 m "uygun"
walk_tolerance_m: 500      # 1000-1500 m arası "sınırda" (yine bildirilir), üstü "uzak" (bildirilmez)
walk_speed_m_per_min: 80

rooms_allowed: []          # boş = her oda tipi; ör. ["1+0", "1+1", "2+1", "3+1"]
rooms_priority: ["1+1"]
furnished_accept: ["full", "partial", "either"]   # bildirim için kabul edilen eşya durumları
include_unknown_furnished: false                  # eşya durumu belirsiz ilanları da bildir
exclude_flags: ["gunluk", "oda", "uzak"]          # bu bayraklı ilanlar bildirilmez (yine kaydedilir)
notify_all_changes: true                          # her taramadan sonra kriter dışı olanlar dahil tüm
                                                  # değişikliklerin tek mesajlık özeti (nedenleriyle)
heartbeat_quiet_hours: 3                          # gündüz bu kadar saat hiç bildirim gitmezse 'değişiklik yok,
                                                  # sistem çalışıyor' mesajı (0 = kapalı)
cheap_ratio: 0.6                                  # bölge medyanının %40 altı -> ⚠️ fiyat_cok_dusuk
missing_scans_before_removed: 2                   # ardışık kaç taramada görünmezse "yayından kalktı"
block_cooldown_min: 45                            # bir kaynak engellenince (429/Cloudflare) bu kadar süre o kaynağa dokunma
notify_removed: true                              # daha önce bildirilen ilan kalkınca haber ver
compact_threshold: 12                             # tek taramada bundan fazla değişiklik varsa tek liste gönder

# --- filtre sayfası (GitHub Pages) ve işe ulaşım tahmini
web:
  title: "M2 Kiralık"
  url: "https://ysftnc.github.io/m2kira/"   # Telegram mesajlarındaki link
  telegram_bot: "Iremev_bot"                 # sitede "Telegram'da aç" linki
commute:                   # kapıdan kapıya ≈ yürüme + bekleme + durak sayısı × dk/durak + ek süre
  ride_min_per_stop: 2.2   # M2'de duraklar arası ortalama
  wait_min: 3
  unknown_walk_min: 10     # konumu olmayan ilan için varsayılan yürüme
  targets:
    - {name: "Milli Kütüphane", dat: "Milli Kütüphane'ye", short: "MK", station: "Milli Kütüphane", extra_min: 0}
    - {name: "Şehir Hastanesi", dat: "Şehir Hastanesi'ne", short: "ŞH", station: "Tarım Bakanlığı-Danıştay", extra_min: 15,
       note: "Tarım Bakanlığı–Danıştay durağından 113-5 otobüsü dahil (≈15 dk, tahmini)"}

request_interval_sec: 5    # aynı siteye ardışık istekler arası en az bekleme
cache:
  list_ttl_min: 20
  detail_ttl_hours: 24
data_dir: data             # sqlite, önbellek, tarayıcı profilleri, log

notify:
  channels: [telegram]     # telegram | email | ntfy | console (birden fazla olabilir)
  email:
    host: ""               # ya da SMTP_HOST .env'de
    port: 587
    from: ""
    to: ""
    tls: true
  ntfy:
    server: https://ntfy.sh
    topic: ""              # ya da NTFY_TOPIC .env'de

sources:
  hepsiemlak:
    enabled: true
    # Her taramada yalnız "eşyalı daire" listeleri (hızlı geçiş: yeni ilan + fiyat düşüşü).
    # Mahalle başına günde bir "tam geçiş": residence + filtresiz listeler (başlıkta eşyalı yazan ama
    # site bayrağı olmayan ilanlar) + yayından kalkma tespiti. Taramada en çok 4 mahalle tam geçer.
    fast_categories: [daire]
    categories: [daire, residence]
    full_scan_every_hours: 24
    max_full_per_run: 2      # 30 dakikada bir taramada günde bir tam geçiş için yeterli
    scan_unfiltered: true
    max_pages: 5
    max_detail_fetch: 10   # (30 dk aralıkla) tarama başına en fazla detay sayfası (eşya belirsiz / koordinatsız ilanlar; kalanı sonraki taramada)
    detail_for_coords: true
    headless: true
    slug_prefix: "cankaya-"
    min_interval_sec: 15   # 5 sn aralık + resim/JS ile ~25 sayfada HTTP 429; yalnız HTML ile 15 sn'de 109 sayfa sorunsuz.
                           # 20.10.2026: 8 sn'ye indirilince PC taramaları 21-24. sayfada 429 aldı -> yeniden 15
    cooldown_sec: 120      # 429/doğrulama görülürse bu kadar bekleyip bir kez daha dene
    block_resources: true  # sayfa başına yalnızca HTML'i yükle (resim/JS/XHR hız sınırına sayılıyor)
  hepsiemlak_feed:         # GitHub tarafı: PC'nin `feed-push` ile gönderdiği hepsiemlak beslemesi
    enabled: true          # (hepsiemlak GitHub'ın veri merkezi IP'lerini Cloudflare'da engelliyor)
    min_interval_min: 55   # en az saatte bir: 30 dakikada bir taramada bir gün sonra ilk sayfada HTTP 429 geldi (21.10.2026)
    repo: YSFTNC/m2kira
    branch: feed
    path: feed/hepsiemlak.json
    max_age_hours: 3       # daha eski besleme işlenmez (PC kapalı): ilan silinmez, uyarı gitmez
  sahibinden_feed:         # PC: kullanıcının giriş yapılmış Chrome profiliyle (görünmez) birleşik arama -> GitHub
    enabled: true
    min_interval_min: 115  # en az ~2 saatte bir dene: 30 dakikada bir açılan arama 'olağan dışı erişim'
                           # sayfasına düştü (20.10.2026); yeni ilanları anında sahibinden uygulaması bildiriyor
    path: feed/sahibinden.json
    max_age_hours: 3
    headless: true         # gerçek Chrome --headless=new: sahibinden'in korumasını geçti (19.10.2026)
    max_detail_fetch: 5    # tarama başına en fazla yeni ilan detayı (konum için; 30 dk aralıkla saatte ~10); önbellekte kalır.
                           # 20.10.2026: 11:55'te 20 detay, 13:10'da 4 detaydan sonra giriş duvarı -> ~24/saat sınırı var
  emlakjet:
    enabled: true
    fast_categories: [kiralik-daire]
    categories: [kiralik-daire, kiralik-residence]
    full_scan_every_hours: 6   # residence + yayından kalkma tespiti 6 saatte bir
    max_pages: 5
    max_detail_fetch: 60   # emlakjet listesinde eşya/koordinat yok; ilk taramalarda detay yükü buradan sınırlanır
    detail_for_coords: true
  sahibinden:               # PC açıkken: kullanıcının Chrome'u üzerinden tek birleşik arama (22 mahalle, 2-3 sayfa)
    enabled: true           # PC kapalıyken: sahibinden'in kendi "M2 eşyalı 39bin altı" favori arama bildirimleri
    mode: cdp               # cdp: kullanıcının kendi Chrome'una bağlan (python main.py sahibinden-chrome)
                            # browser: Playwright Chromium (Cloudflare/PerimeterX doğrulaması döngüye girebiliyor)
                            # mail: tarayıcı kullanma, yalnızca aşağıdaki e-posta kaynağı
    cdp_url: http://127.0.0.1:9222
    max_pages: 4
    max_detail_fetch: 10
    headless: false         # headless PerimeterX'e takılıyor; görünür Chromium kullanılır (browser modu)
    offscreen: true         # görünür pencere ekran dışında açılır (taramada rahatsız etmez)
    headed_fallback: true
    price_filter: true      # ?price_max=<bütçe+%5>
    min_interval_sec: 10
    cooldown_sec: 90
  sahibinden_mail:          # sahibinden "favori arama" e-posta bildirimlerini IMAP'ten oku (sunucuda da çalışır)
    enabled: true           # IMAP_USER / IMAP_PASSWORD .env'de yoksa sessizce "tanımlı değil" der
    host: imap.gmail.com
    folder: INBOX
    sender: sahibinden      # gönderen adresinde geçen metin
    lookback_days: 2        # ilk çalıştırmada kaç günlük e-postaya bakılsın
    assume_furnished: true  # kayıtlı aramada "Eşyalı" filtresi açık varsayılır

